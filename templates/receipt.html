<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <title>Pay Stub #{{ stub.id }}</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #fff; color: #000;
            padding: 20px; max-width: 300px;
            margin: 20px auto; border: 2px dashed #000;
        }
        h2 {
            text-align: center;
            text-transform: uppercase;
            font-weight: 900; margin-bottom: 5px;
        }
        .divider {
            border-bottom: 2px dashed #000; margin: 10px 0;
        }
        .flex {
            display: flex; justify-content: space-between; font-weight: bold;
        }
        @media print {
            body { border: none; margin: 0; }
        }
    </style>
</head>

<body onload="window.print()">

    <h2>{{ brand.name }}</h2>
    <p style="text-align: center; margin-top: 0; font-size: 0.9rem;">Official Pay Stub</p>
    <div class="divider"></div>
    <div class="flex"><span>Receipt #:</span> <span>{{ stub.id }}</span></div>
    <div class="flex"><span>Employee:</span> <span>{{ stub.name }}</span></div>
    
    <div class="divider"></div>

    <div class="flex" style="font-size: 0.9rem;">
        <span>Regular Pay:</span>
        <span>${{ stub.regular_pay }}</span>
    </div>
    <div class="flex" style="font-size: 0.9rem;">
        <span>Overtime Pay:</span>
        <span>${{ stub.overtime_pay }}</span>
    </div>
    <div class="flex" style="font-size: 0.9rem;">
        <span>Est. Taxes:</span>
        <span>${{ stub.tax }}</span>
    </div>

    <div class="divider" style="border-bottom: 2px solid #000;"></div>

    <div class="flex" style="font-size: 1.2rem;">
        <span>NET TAKE-HOME:</span>
        <span>${{ stub.net_pay }}</span>
    </div>

    <div class="divider"></div>
    
    <p style="text-align: center; font-size: 0.8rem; font-weight: bold;">
        Thank u for ur crawzy work!!
        Gnerated securely by da system.
    </p>

</body>
</html>
