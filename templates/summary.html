{% extends 'base.html' %}
{% block content %}
<div class="panel">
    <header>
    <h1>Business Health</h1>
    <a href="/" style="color: #111; font-weight: bold;">←B2B</a>
    </header>
    <div style="display: flex; gap: 40px; margin-top: 30px; align-items: center;">

        <div style="width: 300px; height: 300px; border-radius: 50%; border: 6px solid #111; box-shadow: 12px 12px 0px #111; background: conic-gradient(green 0% {{vault_pct}}%, gold {{vault_pct}}% {{vault_pct + rev_pct}}%, red {{vault_pct + rev_pct}}% 100%); transition: transform 0.2s ease; display: flex; align-items: center; justify-content: center; cursor: pointer;"
        onmouseover="this.style.transform='scale(1.05) rotate(-5deg)'; this.style.boxShadow='16px 16px 0px #111';"
        onmouseout="this.style.transform='scale(1) rotate(0deg)'; this.style.boxShadow='12px 12px 0px #111';">
        
        <div style="width: 120px; height: 120px; background: white; border-radius: 50%; border: 6px solid #111; box-shadow: inset 5px 5px 0px rgba(0,0,0,0.2);"></div>
    </div>

        <div style="flex: 1; font-size: 1.5rem; line-height: 2;">
            <p><span style="color: rgb(103, 208, 103); font-weight: 900;">Vault value:</span> {{vault_pct}}% (${{vault_raw}}</p>
            <p><span style="color:  rgb(254, 228, 77); font-weight: 900;">Revenue:</span> {{rev_pct}}% (${{rev_raw}})</p>
            <p><span style="color: rgb(221, 76, 76); font-weight: 900;">Payroll:</span> {{pay_pct}}% (${{pay_raw}})</p>
        </div>
    </div>
</div>
{% endblock %}
