{% extends 'base.html' %}
{% block content %}
        <div class="panel">
            <header>
                <h1>The register</h1>
                <a href="/" style="color: #111; font-weight: bold;">←B2B (Back to base)</a>
            </header>
            <div class="module-card" style="text-align: left;">
                <h2>ring up the customer</h2>
                <form action="/register" method="POST" style="display: flex; gap: 10px;">
                    <select name="item_id" required style="flex: 2; padding: 12px; border: 3px solid var(--border-color); font-family: inherit; font-size: 1rem;">
                        <option value="">--pick an item --</option>
                        {% for item in items %}
                        <option value="{{ item.id }}">{{ item.name }} (${{ item.price }}) - {{ item.quantity }} in stock</option>
                        {% endfor %}                 
                    </select>
                    <select name="vip_id" style="flex: 1.5; padding: 12px; border: 3px solid var(--border-color); font-family: inherit; font-size: 1rem;">
                        <option value="">--no Whale --</option>
                        {% for vip in customers %}
                        <option value="{{ vip.id }}">{{ vip.name }}</option>
                        {% endfor %}
                    </select>
                    <input type="number" name="qty_sold" placeholder="qty" required style="flex: 1;">
                    <button type="submit">cash out 💸</button>
                </form>
            </div>
            <table>
                <tr>
                    <th>item sold</th>
                    <th>qty</th>
                    <th>revenue $$$</th>
                </tr>
                {% for order in orders %}
                <tr>
                    <td style="font-weight: bold;">{{ order.item }}</td>
                    <td>{{ order.qty }}</td>
                    <td style="color: #008F11; font-weight: 900;">+${{ order.revenue }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>
{% endblock %}
