<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Spill the Tea (CRM)</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body class="{{ brand.theme }}">
        <div class="glass-container">

            <header>
                <h1>SPILL TEA ☕</h1>
                <a href="/" style="color: #111; font-weight: bold;">Back to Base</a>
            </header>
            <div class="glass-card" style="text-align: left;">
                <h2>Who's going bonkers?</h2>
                <form action="/crm" method="POST" style="display: flex; gap: 10px;">
                    <input type="text" name="customer_name" placeholder="Name bro" required style="flex: 1;">
                    <input type="text" name="issue_desc" placeholder="Describe the issue..." required style="flex: 2;">
                    <button type="submit">log itt</button>
                </form>
            </div>
            <table>
               <tr> 
                <th>receipt #</th>
                <th>the person</th>
                <th>the drama</th>
                <th>vibe check</th>
               </tr>
               {% for ticket in tickets %}
               <tr>
                   <td>#{{ ticket.id }}</td>
                    <td style="font-weight: bold">{{ ticket.customer }}</td>
                    <td>{{ ticket.issue }}</td>
                    <td style="font-weight: bold; color: {% if ticket.status == 'Open' %}#E03C31{% else %}#008F11{% endif %};">
                        {{ ticket.status }}
                    </td>
               </tr>
               {% endfor %}            
            </table>

        </div>
</body>
</html>
