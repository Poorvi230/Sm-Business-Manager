<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>Inventory - Business Suite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    </head>
    <body>
        <div class="glass-container">
            <header>
                <h1> INVENTORY</h1>
                <a href="/" style="color: #111; text-decoration: none; font-weight: bold;">Back to Dashboard</a>
            </header>

 <div class="glass-card" style="margin-bottom: 2rem; text-align: left;">
                <h2 style="margin-top: 0;">Add New Item</h2>
                <form action="/inventory" method="POST" style="display: flex; gap: 10px;">
                    <input type="text" name="item_name" placeholder="Item Name" required style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; flex: 2;">
                    <input type="number" name="item_qty" placeholder="Quantity" required style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; flex: 1;">
                    <input type="number" step="0.01" name="item_price" placeholder="Price ($)" required style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; flex: 1;">
                    <button type="submit" style="padding: 10px 20px; border-radius: 5px; border: none; background-color: var(--bauhaus-blue); color: white; cursor: pointer;">Add Item</button>
                </form>
            </div>
            <table style="width: 1005; text-align: left; border-collapse: collapse;">
                <tr style="border-bottom: 2px solid rgba(0,0,0,0.2);">
                    <th style="padding: 10px;">ID</th>
                    <th style="padding: 10px;">Name</th>
                    <th style="padding: 10px;">Quantity</th>
                    <th style="padding: 10px;">Price</th>
                </tr>
                
                {% for item in items %}
                <tr style="border-bottom: 1px solid rgba(0,0,0,0.1);">
                    <td style="padding: 10px;">{{ item.id }}</td>
                    <td style="padding: 10px;">{{ item.name }}</td>
                    <td style="padding: 10px;">{{ item.quantity }}</td>
                    <td style="padding: 10px;">${{ item.price }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </body>
</html>
