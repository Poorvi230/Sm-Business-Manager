<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>The Vault</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    </head>
    <body class="{{ brand.theme }}">
        <div class="glass-container">
            <header>
                <h1> The Vault</h1>
                <a href="/" style="color: #111; font-weight: bold;">Back to Base</a>
            </header>

 <div class="glass-card" style="text-align: left;">
                <h2>What are we hoarding?</h2>
                <form action="/inventory" method="POST" style="display: flex; gap: 10px;">
                    <input type="text" name="item_name" placeholder="{{ brand.inv_placeholder }}" required style="flex: 2;">
                    <input type="number" name="item_qty" placeholder="Quantity" required style="flex: 1;">
                    <input type="number" step="0.01" name="item_price" placeholder="Price ($)" required style="flex: 1;">
                    <button type="submit">stash it</button>
                </form>
            </div>
            <table>
                <tr>
          <th>sku</th>
          <th>item</th>
          <th>stock</th>
          <th>value</th>
        </tr>
        {% for item in items %}
        <tr>
            <td>{{ item.id }}</td>
            <td style="font-weight: bold;">{{ item.name }}</td>
            <td style="{% if item.quantity < 5 %}color: red; font-weight: 900;{% endif %}">
                {{ item.quantity }}
     </td>
     <td>${{ item.price }}</td>
        </tr>
        {% endfor %}
        </table>

    </div>
</body>
</html>
